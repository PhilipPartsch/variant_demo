# --- LINKS (taken over from the BMS, plus allocates) ----------------------------
[needs.links.traces_to]
incoming = "traces_from"
outgoing = "traces_to"

[needs.links.satisfies]
incoming = "satisfied_by"
outgoing = "satisfies"

[needs.links.refines]
incoming = "refined_by"
outgoing = "refines"

[needs.links.implements]
incoming = "implements_back"
outgoing = "implements"

[needs.links.verifies]
incoming = "verifies_back"
outgoing = "verifies"

[needs.links.results_for]
incoming = "results"
outgoing = "results_for"

[needs.links.affects]
incoming = "affected_by"
outgoing = "affects"

[needs.links.motivates]
incoming = "motivated_by"
outgoing = "motivates"

[needs.links.mitigates]
incoming = "mitigated_by"
outgoing = "mitigates"

[needs.links.gap_for]
incoming = "gaps"
outgoing = "gap_for"

# New: CV arch -> BMS interface requirement (external BMS_REQ_*). The only link
# with variant functions, e.g. `:allocates: <<bev: BMS_REQ_POWER_DERATING>>`.
[needs.links.allocates]
incoming = "allocated_from"
outgoing = "allocates"
parse_variants = true

# --- FIELDS ---------------------------------------------------------------------
# Imported BMS needs are dropped (unknown type) or stripped (unknown field)
# unless the CV project declares the BMS vocabulary, so every BMS field is
# declared here even where the CV never sets it itself.

[needs.fields.status]
description = "Lifecycle state of an authored spec need: draft -> review -> approved; `imported` on every pinned BMS need."
schema = { type = "string", enum = ["draft", "review", "approved", "imported"] }

[needs.fields.value]
description = "Product-specific value of a vehicle requirement, resolved per product (variant functions)."
default = ""
nullable = false
parse_variants = true

[needs.fields.product]
description = "Product the evidence (test result, gap) belongs to; one of configs/*_defconfig."
default = ""
nullable = false
schema = { type = "string", enum = ["", "bus_bev_lfp_eu", "truck_bev_lfp_na", "truck_bev_nmc_eu", "truck_diesel_eu"] }

[needs.fields.chemistry]
description = "BMS: pack cell chemistry a chemistry-specific need is resolved for (NMC or LFP)."
default = ""
nullable = false
schema = { type = "string", enum = ["", "NMC", "LFP"] }

[needs.fields.outcome]
description = "Recorded outcome of one test case in one run: passed, failed, error or skipped."
default = ""
nullable = false
schema = { type = "string", enum = ["", "passed", "failed", "error", "skipped"] }

[needs.fields.runtime_s]
description = "Wall-clock runtime of that test case, in seconds, as the report recorded it."
default = ""
nullable = false

[needs.fields.test_run_label]
description = "Identifier of the test run the outcome came from: the report's timestamp, as a label."
default = ""
nullable = false
schema = { type = "string", pattern = "^$|^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}" }

[needs.fields.chain_reqs]
description = "Requirement ids this test result is evidence for, via test -> swreq -> arch -> req."
default = ""
nullable = false

[needs.fields.gap_category]
description = "Which gate reported this gap: trace_backward, trace_forward, orphan, status_disallowed, ..."
default = ""
nullable = false

[needs.fields.gap_link]
description = "The link name the reporting gate counted, when the gap is a trace gap; empty otherwise."
default = ""
nullable = false
schema = { type = "string", enum = [
  "",
  "traces_to",
  "satisfies",
  "refines",
  "implements",
  "verifies",
  "results_for",
  "affects",
  "motivates",
  "mitigates",
  "gap_for",
  "allocates",
  "links",
] }

[needs.fields.gap_shortfall]
description = "How far short the need fell, as a label: \"<have> of <need>\" links present."
default = ""
nullable = false
schema = { type = "string", pattern = "^$|^[0-9]+ of [0-9]+$" }

[needs.fields.gap_need_id]
description = "Id of the need the gap is attributed to, as a field a report template can read."
default = ""
nullable = false
schema = { type = "string", pattern = "^$|^[A-Z]+_[A-Z][A-Z0-9_]*$" }

[needs.fields.gap_need_type]
description = "Type of the need the gap is attributed to, so a report can group gaps by V-model level."
default = ""
nullable = false
schema = { type = "string", enum = [
  "",
  "user_story",
  "req",
  "arch",
  "swreq",
  "impl",
  "test",
  "test_result",
  "risk",
  "decision",
  "gap",
] }

[needs.fields.code_url]
description = "Remote URL of the code marker (codelinks). Nullable: the BMS export carries null."
default = ""

# --- CODE ANALYSIS (B§6.2) --------------------------------------------------------
# One codelinks project per subsystem and tree. The libclang preprocessor drops
# markers in inactive `#if CONFIG_*` branches: compile_commands.json is the
# active product's copy (CMake Tools cmake.copyCompileCommands, or
# tools/build_product.sh); files without a database entry fall back to
# build/active/autoconf.h. Markers: `// @need: <title>, <ID>, [<SWREQ_ID>, ...]`.
[codelinks]
set_local_url = true
set_remote_url = true

[codelinks.projects.vcu]
remote_url_pattern = "https://github.com/PhilipPartsch/variant_demo/blob/{commit}/{path}#L{line}"

[codelinks.projects.vcu.source_discover]
src_dir = "src/vcu"
include = ["**/*.c", "**/*.h"]
comment_type = "cpp"

[codelinks.projects.vcu.analyse]
get_oneline_needs = true
get_need_id_refs = false
get_rst = false

[codelinks.projects.vcu.analyse.preprocessor]
compile_commands = "build/compile_commands.json"
includes = ["build/active", "src/vcu/include"]
defines = []

[codelinks.projects.vcu.analyse.oneline_comment_style]
start_sequence = "@need:"
field_split_char = ","
needs_fields = [
  { name = "title", type = "str" },
  { name = "id", type = "str" },
  { name = "implements", type = "list[str]", default = [] },
  { name = "type", type = "str", default = "impl" },
]

[codelinks.projects.vcu_tests]
remote_url_pattern = "https://github.com/PhilipPartsch/variant_demo/blob/{commit}/{path}#L{line}"

[codelinks.projects.vcu_tests.source_discover]
src_dir = "tests/vcu"
include = ["**/*.c", "**/*.h"]
comment_type = "cpp"

[codelinks.projects.vcu_tests.analyse]
