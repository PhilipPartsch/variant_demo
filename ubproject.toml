style = "usecase"

[[needs.types]]
directive = "req"
title = "Requirement"
prefix = "REQ_"
color = "#FDBA74"
style = "file"

[[needs.types]]
directive = "arch"
title = "Architecture"
prefix = "ARCH_"
color = "#818CF8"
style = "node"

[[needs.types]]
directive = "swreq"
title = "Software Requirement"
prefix = "SWREQ_"
color = "#7DD3FC"
style = "card"

[[needs.types]]
directive = "impl"
title = "Implementation"
prefix = "IMPL_"
color = "#C084FC"
style = "component"

[[needs.types]]
directive = "test"
title = "Test"
prefix = "TEST_"
color = "#BBF7D0"
style = "hexagon"

[[needs.types]]
