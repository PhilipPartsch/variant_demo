# --- AI WORKFLOW (B§7) ------------------------------------------------------------
# Streams are the subsystems (vcu, chg, eng); vehicle-level stages are global.
# Imported BMS needs (status `imported`) are context, not CV work items.
[workflow]
exempt_status = ["imported"]
orphan_exempt_types = ["user_story", "req", "arch", "swreq", "gap"]

[workflow.diagram]
enabled = false
format = "mermaid"

[[workflow.stages]]
id = "user_stories"
produces = "user_story"
review_skill = "review-feat"
authoring = "Write vehicle-level user stories, one user-observable capability each. Variant-specific stories are gated with the named variants (bev, bus, mcs); no build-type or kit conditions."
[workflow.stages.route]
scope = "global"
granularity = "single"
path = "docs/vehicle/user_stories.rst"

[[workflow.stages]]
id = "reqs"
produces = "req"
depends_on = ["user_stories"]
author_skill = "draft-requirement"
review_skill = "review-requirement"
authoring = "Decompose the user story into the complete set of vehicle requirements it implies — the happy path, the error and edge cases, and the relevant non-functional constraints. Author in the 150% source: gate variant-specific requirements with the named variants (bev, bus, mcs) or the region folders, at least as strongly as their parent; put product-specific values into the `value` field with variant functions; write alternatives as complementary `if` blocks sharing one id."
[workflow.stages.route]
scope = "global"
granularity = "single"
path = "docs/vehicle/requirements.rst"
[[workflow.stages.trace]]
link = "traces_to"
up = "user_story"
direction = "both"
min = 1

[[workflow.stages]]
id = "archs"
produces = "arch"
depends_on = ["reqs"]
author_skill = "draft-arch"
review_skill = "review-arch"
authoring = "Produce the architecture elements the requirements need (one per distinct responsibility, enough that every requirement is satisfied by at least one element). Place variant-specific elements in the subsystem folder of their variant (chg: BEV, eng: diesel); gate any other variant-specific content with the named variants, at least as strongly as the parent requirement."
[workflow.stages.route]
scope = "stream"
granularity = "per-root"
path = "docs/subsystems/{stream}/architecture.rst"
[[workflow.stages.trace]]
link = "satisfies"
up = "req"
direction = "both"
min = 1

[[workflow.stages]]
id = "bms_allocation"
produces = "arch"
depends_on = ["reqs"]
author_skill = "draft-allocation"
review_skill = "review-arch"
authoring = "Write one black-box BMS element per CV requirement it serves; it satisfies the CV requirement and allocates only BMS interface needs (BMS_REQ_*, tag interface). The page is BEV only. Reference BMS values, never copy them."
[workflow.stages.route]
scope = "global"
granularity = "single"
path = "docs/subsystems/bms/architecture.rst"
[[workflow.stages.trace]]
link = "satisfies"
up = "req"
direction = "both"
min = 1
[[workflow.stages.trace]]
link = "allocates"
up = "req"
direction = "outgoing"
min = 1

[[workflow.stages]]
id = "swreqs"
produces = "swreq"
depends_on = ["archs"]
author_skill = "draft-requirement"
review_skill = "review-requirement"
authoring = "Decompose each architecture element into the software requirements it owes: behaviour, interfaces and signals, error and degraded-mode handling, timing, accuracy and resource bounds. One shall-clause per requirement. Gate each swreq at least as strongly as its parent arch element."
[workflow.stages.route]
scope = "stream"
granularity = "per-root"
path = "docs/subsystems/{stream}/software_requirements.rst"
[[workflow.stages.trace]]
link = "refines"
up = "arch"
direction = "both"
min = 1

[[workflow.stages]]
id = "code"
produces = "impl"
depends_on = ["swreqs"]
author_skill = "draft-impl"
authoring = "Author one implementation need per software requirement as a one-line marker `// @need: <title>, IMPL_<...>, [SWREQ_<...>]` in the C source of its subsystem, with real code beneath it. Feature code sits in `#if CONFIG_<...>` blocks; an alternative implementation uses the same need id in `#if` / `#else`."
[workflow.stages.route]
scope = "global"
granularity = "global"
path = "src"
[[workflow.stages.trace]]
link = "implements"
up = "swreq"
direction = "both"
min = 1

[[workflow.stages]]
id = "tests"
produces = "test"
depends_on = ["code"]
author_skill = "draft-test"
authoring = "Author one test need per software requirement as a one-line marker `// @need: <title>, TEST_<...>, [SWREQ_<...>]` in the C test source of its subsystem, gated like the code it tests. Every test file is built by CMake."
[workflow.stages.route]
scope = "global"
granularity = "global"
path = "tests"
[[workflow.stages.trace]]
link = "verifies"
up = "swreq"
direction = "both"
min = 1

[[workflow.stages]]
id = "test_results"
optional = true
produces = "test_result"
[workflow.stages.route]
scope = "global"
granularity = "single"
path = "docs/_global/test_results.rst"
[[workflow.stages.trace]]
link = "results_for"
up = "test"
direction = "outgoing"
min = 1

[[workflow.stages]]
id = "risks"
optional = true
produces = "risk"
[workflow.stages.route]
scope = "global"
granularity = "single"
path = "docs/_global/risks.rst"
[[workflow.stages.trace]]
link = "mitigates"
up = "req"
direction = "outgoing"
min = 1

[[workflow.stages]]
id = "decisions"
optional = true
produces = "decision"
author_skill = "record-decision"
review_skill = "review-decision"
[workflow.stages.route]
scope = "global"
granularity = "single"
path = "docs/_global/decisions.rst"
[[workflow.stages.trace]]
link = "affects"
up = "arch"
direction = "outgoing"
min = 1

# --- QUALITY (B§7.3) ---------------------------------------------------------------
[quality]
enabled = true

[quality.required]
parent_fit = 1
variant_consistency = 1

[quality.type_configs.req]
criteria_file = "metamodel/quality/requirement.toml"

[quality.type_configs.swreq]
criteria_file = "metamodel/quality/requirement.toml"

[quality.type_configs.arch]
criteria_file = "metamodel/quality/arch.toml"

[quality.type_configs.user_story]
criteria_file = "metamodel/quality/feat.toml"

[quality.type_configs.decision]
criteria_file = "metamodel/quality/decision.toml"

[quality.type_configs.decision.required]
context_present = 1
