"$schema" = "https://ubcode.useblocks.com/ubproject.schema.json"

# CV platform: one configuration for ubCode / ubc, sphinx-needs (docs/conf.py
# reads this file via needs_from_toml), sphinx-mounts (sources_from_toml),
# sphinx-codelinks (src_trace_config_from_toml) and the AI workflow.
#
# The product is selected in CMake Tools (or `tools/build_product.sh <product>`).
# Configuring a product writes the active copies in build/active/ that this file
# points at: variants.json (var.*), autoconf.h (codelinks fallback) and
# bms.needs.json (BMS needs of the product's chemistry).

[project]
name = "cv_platform"

[source]
dir = "docs"
extend_exclude = ["_build"]

[parse.parsers.rst]

[scripts]
build-all = "tools/build_all.sh"
check = "ubc check"
needs = "ubc build needs -o build/ubc/needs.json"
html = "ubc build html -o build/ubc/html"
report = "ubc report needs_overview.html.j2 -o build/ubc/needs_overview.html"

# --- NEEDS: global settings (as in the BMS) ------------------------------------
[needs]
id_required = true
# Also matches the imported, prefixed BMS ids (BMS_REQ_...).
id_regex = "^[A-Z]+_[A-Z][A-Z0-9_]*$"
flow_engine = "graphviz"
schema_definitions_from_json = "metamodel/schemas.json"
# Active product (written at CMake configure). Only `[needs] variant_data_file`
# is read by ubc, the ubCode extension and sphinx-needs alike.
variant_data_file = "build/active/variants.json"
# Export imported needs too, so the Sphinx needs.json matches the ubc export
# (sphinx-needs' default "is_external==False" drops them; ubc keeps them).
builder_filter = ""

# --- BMS import (B§5.3) ---------------------------------------------------------
# build/active/bms.needs.json is the pinned BMS export of the product's chemistry
# (third_party/bms/<version>/), or an empty stub for diesel products.
# base_url: one URL per BMS version; the BMS docs are not published yet
# (B§5.2.2), per-chemistry URLs are deferred (B§11). Keep the version in sync
# with cmake/bms.cmake (checked by tools/pin_bms.py --check).
[[needs.external_needs]]
json_path = "build/active/bms.needs.json"
base_url = "https://bms-docs.invalid/0.1.0"
id_prefix = "BMS_"
css_class = "external_bms"

# --- Named variants over the generated var.* (B§2.3, M§1.6) ---------------------
# Conditions compare with == True, never a bare boolean.
[needs.variants]
bev = "var.powertrain.type == 'bev'"
bus = "var.vehicle.type == 'bus'"
mcs = "var.charging.mcs == True"

# --- File variants (M§6); globs are relative to [source] dir = "docs" -------------
[[source.variant_sources]]
if = "var.powertrain.type == 'bev'"
files = ["subsystems/chg/**", "subsystems/bms/**"]

[[source.variant_sources]]
if = "var.powertrain.type == 'diesel'"
files = ["subsystems/eng/**"]

[[source.variant_sources]]
if = "var.market.region == 'na'"
files = ["region/na/**"]

[[source.variant_sources]]
if = "var.market.region == 'eu'"
files = ["region/eu/**"]

# --- NEED TYPES (taken over from the BMS, incl. colours and styles) -------------
[[needs.types]]
directive = "user_story"
title = "User Story"
prefix = "US_"
